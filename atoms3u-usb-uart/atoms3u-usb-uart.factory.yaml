packages:
  # Include all of the core configuration
  atoms3u-usb-uart: !include atoms3u-usb-uart.yaml

esphome:
  # This will allow for project identification, configuration and updates.
  # The format is `<Manufacturer>.<Device / project name>`.
  project:
    name: M5Stack.AtomS3U USB UART
    version: dev  # This will be replaced by the github workflows with the `release` version

# This should point to the public location of the yaml file that will be adopted.
# In this case it is the core yaml file that does not contain the extra things
# that are provided by this factory yaml file as the user does not need these once adopted.
dashboard_import:
  package_import_url: github://esphome/serial-proxies/atoms3u-usb-uart/atoms3u-usb-uart.yaml

# Sets up Bluetooth LE (Only on ESP32) to allow the user
# to provision wifi credentials to the device.
# Improv via serial is not available as the USB data lines are used as the UART.
esp32_improv:
  authorizer: none

# Used to pull OTA updates
http_request:

ota:
  - platform: http_request

update:
  - platform: http_request
    name: None
    id: update_http_request
    source: https://firmware.esphome.io/serial-proxy/atoms3u-usb-uart/manifest.json
